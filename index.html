<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans JP',sans-serif;
  background:#111;
  color:#fff;
}

/* ===== ヘッダー ===== */
header{
  background:linear-gradient(90deg,#7a0000,#b30000);
  padding:20px;
  text-align:center;
  position:relative;
}
.logo{font-family:'Noto Serif JP';font-size:26px}
.logo-sub{font-size:12px;opacity:.8}
header::after{
  content:"";
  position:absolute;
  bottom:0;
  width:100%;
  height:2px;
  background:#d4af37;
}

/* ===== セクション中央寄せ ===== */
.section{
  padding:40px 15px;
  max-width:600px;
  margin:0 auto;
}

h2{
  font-family:'Noto Serif JP';
  border-left:4px solid #ff6600;
  padding-left:10px;
}

/* ===== 商品（人気） ===== */
.menu-top{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.card{
  width:100%;
  display:flex;
  gap:10px;
  background:#222;
  padding:15px;
  border-radius:10px;
  align-items:center;
}

.card img{
  width:100px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
}

/* ===== 商品一覧 ===== */
.menu-list{
  background:#1a1a1a;
  padding:15px;
  border-radius:10px;
  line-height:2;
  margin-top:20px;
}

/* ===== ギャラリー ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.grid img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

/* ===== モーダル ===== */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.9);
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.modal img{
  max-width:90%;
  max-height:90%;
}

/* ===== マップ ===== */
iframe{
  margin-top:10px;
}

/* ===== フッター ===== */
footer{
  background:#000;
  padding:20px;
  text-align:center;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
<div class="logo">Message</div>
<div class="logo-sub">フラワースタジオ</div>
</header>

<!-- 人気商品 -->
<section class="section">
<h2>人気商品</h2>

<div class="menu-top">

<div class="card">
<img src="https://picsum.photos/200/150?flower">
<div>
<h3>季節のブーケ</h3>
<p>旬の花を使った華やかな一束</p>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/200/150?rose">
<div>
<h3>バラのアレンジメント</h3>
<p>贈り物に人気の定番商品</p>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/200/150?plant">
<div>
<h3>観葉植物ギフト</h3>
<p>長く楽しめるグリーンギフト</p>
</div>
</div>

</div>

<!-- 商品一覧 -->
<div class="menu-list">
・プリザーブドフラワー<br>
・スタンド花<br>
・開店祝いアレンジ<br>
・ウェディング装花<br>
・花束ラッピング<br>
</div>

</section>

<!-- ギャラリー -->
<section class="section">
<h2>作品・店内</h2>

<div class="grid">
<img src="https://picsum.photos/400/300?flower1" onclick="openModal(this)">
<img src="https://picsum.photos/400/300?flower2" onclick="openModal(this)">
<img src="https://picsum.photos/400/300?flower3" onclick="openModal(this)">
<img src="https://picsum.photos/400/300?flower4" onclick="openModal(this)">
</div>

</section>

<!-- アクセス -->
<section class="section">
<h2>アクセス</h2>

<iframe
src="https://www.google.com/maps?q=花屋&output=embed"
width="100%"
height="300"
style="border:0;border-radius:10px;"
loading="lazy">
</iframe>

<p>営業時間：10:00〜19:00</p>
<p>定休日：火曜</p>

</section>

<!-- モーダル -->
<div id="modal" class="modal" onclick="closeModal()">
<img id="modalImg">
</div>

<script>
function openModal(img){
document.getElementById("modal").style.display="flex";
document.getElementById("modalImg").src = img.src;
}
function closeModal(){
document.getElementById("modal").style.display="none";
}
</script>

<footer>
※営業用デモサイト
</footer>

</body>
</html>
