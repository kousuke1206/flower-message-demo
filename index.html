<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans JP',sans-serif;
  background:#fafafa;
  color:#333;
}

/* ===== ヘッダー（上品デザイン） ===== */
header{
  width:100%;
  max-width:640px;
  margin:0 auto;
  padding:30px 20px 20px;
  text-align:center;
  background:#fff;
  box-sizing:border-box;
}

.logo{
  font-family:'Noto Serif JP',serif;
  font-size:28px;
  letter-spacing:0.15em;
}

.logo-sub{
  font-size:12px;
  color:#888;
  margin-top:5px;
}

/* 細ライン（高級感） */
.header-line{
  width:40px;
  height:2px;
  background:#d4af37;
  margin:15px auto 0;
}

/* ===== セクション ===== */
.section{
  width:100%;
  max-width:640px;
  margin:0 auto;
  padding:50px 20px;
  background:#fff;
  box-sizing:border-box;
}

.section + .section{
  margin-top:15px;
}

/* 見出し */
h2{
  font-family:'Noto Serif JP',serif;
  font-size:20px;
  margin-bottom:25px;
}

/* ===== 人気商品 ===== */
.menu-top{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.card{
  display:flex;
  gap:15px;
  background:#f7f7f7;
  padding:15px;
  border-radius:12px;
  align-items:center;
}

.card img{
  width:100px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
}

.card h3{
  margin:0;
  font-size:16px;
}

.card p{
  margin:5px 0 0;
  font-size:13px;
  color:#666;
}

/* ===== 商品一覧 ===== */
.menu-list{
  margin-top:25px;
  line-height:2;
  color:#555;
}

/* ===== ギャラリー ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
}

/* ===== モーダル ===== */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.8);
  justify-content:center;
  align-items:center;
}

.modal img{
  max-width:90%;
  max-height:90%;
}

/* ===== マップ ===== */
iframe{
  margin-top:10px;
  border-radius:12px;
}

/* ===== フッター ===== */
footer{
  text-align:center;
  font-size:12px;
  color:#888;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Message</div>
  <div class="logo-sub">Flower Studio</div>
  <div class="header-line"></div>
</header>

<section class="section">
<h2>人気商品</h2>

<div class="menu-top">

<div class="card">
<img src="https://picsum.photos/200/150?flower">
<div>
<h3>季節のブーケ</h3>
<p>旬の花を使った華やかな一束</p>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/200/150?rose">
<div>
<h3>バラのアレンジメント</h3>
<p>贈り物に人気の定番商品</p>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/200/150?plant">
<div>
<h3>観葉植物ギフト</h3>
<p>長く楽しめるグリーンギフト</p>
</div>
</div>

</div>

<div class="menu-list">
・プリザーブドフラワー<br>
・スタンド花<br>
・開店祝いアレンジ<br>
・ウェディング装花<br>
・ラッピングサービス
</div>

</section>

<section class="section">
<h2>作品・店内</h2>

<div class="grid">
<img src="https://picsum.photos/400/300?flower1" onclick="openModal(this)">
<img src="https://picsum.photos/400/300?flower2" onclick="openModal(this)">
<img src="https://picsum.photos/400/300?flower3" onclick="openModal(this)">
<img src="https://picsum.photos/400/300?flower4" onclick="openModal(this)">
</div>

</section>

<section class="section">
<h2>アクセス</h2>

<iframe
src="https://www.google.com/maps?q=花屋&output=embed"
width="100%"
height="300">
</iframe>

<p>営業時間：10:00〜19:00</p>
<p>定休日：火曜</p>

</section>

<div id="modal" class="modal" onclick="closeModal()">
<img id="modalImg">
</div>

<script>
function openModal(img){
document.getElementById("modal").style.display="flex";
document.getElementById("modalImg").src = img.src;
}
function closeModal(){
document.getElementById("modal").style.display="none";
}
</script>

<footer>
© Flower Studio Message
</footer>

</body>
</html>
